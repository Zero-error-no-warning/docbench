<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="入力項目の定義、フォーム入力、書類出力に対応するブラウザツール。"><title>DocBench</title><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="vendor/jsuites.css"><link rel="stylesheet" href="vendor/jspreadsheet.css"></head>
<body class="app-shell">
<header class="topbar"><button id="sidebar-toggle" aria-label="サイドバーを折りたたむ" aria-expanded="true" aria-controls="app-sidebar" title="サイドバーを折りたたむ">☰</button><span class="brand"><span class="brand-mark">D</span><span class="brand-name">DocBench</span></span><div class="workspace-heading"><h1 id="workspace-title"></h1><button id="definition-settings" title="書類全体の名前・説明を編集" aria-label="書類名・説明">書類名・説明</button></div><div class="header-right"><span id="save-status" class="save-status" role="status">読み込み中</span><button id="undo" title="元に戻す Ctrl+Z">↶</button><button id="redo" title="やり直す Ctrl+Shift+Z">↷</button><button id="history-open">履歴・派生</button><button id="files-open" class="primary">保存・読込</button></div></header>
<aside id="app-sidebar" class="app-sidebar" aria-label="工程と書類の操作"><button id="workspace-new" class="workspace-new" title="空の新規書類を作成" aria-label="新規書類"><span class="nav-symbol">＋</span><span class="sidebar-label">新規書類</span></button><nav class="tabs" aria-label="作業工程"><button data-view="types" title="型を定義" aria-label="型を定義"><span class="nav-symbol">01</span><span class="nav-label">型を定義</span></button><button data-view="definition" title="要件を定義" aria-label="要件を定義"><span class="nav-symbol">02</span><span class="nav-label">要件を定義</span></button><button data-view="rules" title="条件を設計" aria-label="条件を設計"><span class="nav-symbol">03</span><span class="nav-label">条件を設計</span></button><button data-view="render" title="出力を設計" aria-label="出力を設計"><span class="nav-symbol">04</span><span class="nav-label">出力を設計</span></button><button data-view="form" title="入力・書類作成" aria-label="入力・書類作成"><span class="nav-symbol">05</span><span class="nav-label">入力・書類作成</span></button><button data-view="help" class="help-tab" title="使い方" aria-label="使い方"><span class="nav-symbol">?</span><span class="nav-label">使い方</span></button></nav><div class="sidebar-bottom"><details class="workspace-info"><summary title="作成者・派生の設定" aria-label="作成者・派生の設定"><span class="nav-symbol">⚙</span><span class="sidebar-label">作成者・派生</span></summary><div class="workspace-meta"><span id="branch-badge" class="badge"></span><label class="actor-label">作成者<input id="actor" aria-label="作成者"></label></div></details><button id="mode-switch" title="編集者画面へ">編集者画面へ</button><footer><button id="definition-json-open" class="small" title="項目定義（Definition）" aria-label="項目定義（Definition）"><span class="nav-symbol">定</span><span class="sidebar-label">項目定義（Definition）</span></button><button id="specification-open" class="small" title="出力定義の仕様" aria-label="出力定義の仕様"><span class="nav-symbol">仕</span><span class="sidebar-label">出力定義の仕様</span></button><span class="sidebar-label">DocBench 0.1</span></footer></div></aside>
<main id="app"></main>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="閉じる">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/jszip.min.js"></script><script src="vendor/pako.min.js"></script><script src="vendor/docx.js"></script><script src="vendor/pptxgen.min.js"></script><script src="vendor/exceljs.min.js"></script><script src="vendor/jsuites.js"></script><script src="vendor/jspreadsheet.js"></script><script src="vendor/konva.min.js"></script><script src="vendor/tiptap.min.js"></script><script src="vendor/rete.min.js"></script><script src="src/core.js"></script><script src="src/tree-enum.js"></script><script src="src/tree-outline.js"></script><script src="src/types.js"></script><script src="src/rules.js"></script><script src="src/layout.js"></script><script src="src/word-model.js"></script><script src="src/render.js"></script><script src="src/designer.js"></script><script src="src/editors.js"></script><script src="src/specification.js"></script><script src="src/rule-editor.js"></script><script src="src/type-editor.js"></script><script src="src/pane-layout.js"></script><script src="src/app.js"></script>
</body></html>
