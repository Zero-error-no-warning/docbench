name: Verify and publish DocBench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development tools (runtime libraries are already local)
        run: npm --prefix scripts/qa install --ignore-scripts --no-audit --no-fund
      - name: Generate portable HTML with local vendor libraries
        run: npm run build:portable
      - name: Verify identity, constraints, merges and Office exports
        run: npm run test:offline
      - name: Install test browser
        run: ./scripts/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify graphical workflows and offline portable app
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
      - name: Stage static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r src vendor portable docs dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
